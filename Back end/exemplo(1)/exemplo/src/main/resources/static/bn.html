<!DOCTYPE html>

<head>

	<script>
		const params = new URLSearchParams(window.location.search);
		const nome = atob(params.get("username"));
		const senha = atob(params.get("senha"));



		function addLinha(listaProduto) {

			const produtos = JSON.parse(listaProduto);
			document.getElementById("produtos").value = listaProduto;
			const produto = {
				id: 1,
				nome: "Café",
				descricao: "Café torrado",
				preco: 10,
				tipo: "Bebida",
				quantidade: 100,
				ativo: "T"
			};





			document.getElementById("tabela-produtos").getElementsByTagName("tbody")[0].innerHTML = ""; // Limpa a tabela
			produtos.forEach(produto => {
				if (produto.ativo == "T") {
					const linha = document.getElementById("tabela-produtos").getElementsByTagName("tbody")[0].insertRow();

					linha.insertCell().textContent = produto.id;
					linha.insertCell().textContent = produto.nome;
					linha.insertCell().textContent = produto.descricao;
					linha.insertCell().textContent = produto.preco;
					linha.insertCell().textContent = produto.tipo;
					linha.insertCell().textContent = produto.quantidade;

					linha.insertCell().textContent = produto.ativo;
				}
			});
		}

	</script>
